Items.PrototypeHerculesWeaponModAbility:
  effectors:
    - $base: Effectors.TriggerAttackOnAttackEffect
      prereqRecord:
        $base: Prereqs.ANDPrereq
        nestedPrereqs:
          - $base: Prereqs.ORPrereq
            nestedPrereqs:
              - $base: Prereqs.PostProcessHitTriggered
                isSynchronous: false
                conditions:
                  - Prereqs.TargetKilledHitPrereqCondition
                  - $base: Prereqs.StatusEffectPresentHitPrereqCondition
                    statusEffect: Defeated
                    checkType: CheckType.Type
                    invert: true
                  - $base: Prereqs.WeaponTypeHitPrereqCondition
                    weaponType: Ranged
                  - $base: Prereqs.TargetNPCTypeHitPrereqCondition
                    npcType: Human
              - $base: Prereqs.PostProcessHitTriggered
                isSynchronous: false
                conditions:
                  - Prereqs.TargetKilledHitPrereqCondition
                  - $base: Prereqs.StatusEffectPresentHitPrereqCondition
                    statusEffect: BaseStatusEffect.Hercules_Poison
                    checkType: CheckType.Record
                  - $base: Prereqs.TargetNPCTypeHitPrereqCondition
                    npcType: Human
          - $base: Prereqs.ProcessHitTriggered
            conditions:
              - $base: Prereqs.StatusEffectPresentHitPrereqCondition
                tagToCheck: DPAE_CHEM_Active
                checkType: CheckType.Tag
                objectToCheck: Instigator
      attackRecord: Attacks.BiotechHerculesPoison
      triggerHitReaction: true
      isRandom: true
      applicationChance: 1.0
    - $type: ModifyAttackCritChanceEffector
      prereqRecord:
        $base: Prereqs.ProcessHitTriggered
        conditions:
          - $base: Prereqs.StatusEffectPresentHitPrereqCondition
            statusEffect: Poisoned
            checkType: CheckType.Type
          - $base: Prereqs.TargetTypeHitPrereqCondition
            targetType: Player
            invert: true
      critChance:
        - $type: gamedataConstantStatModifier_Record
          statType: BaseStats.CritChance
          modifierType: Additive
          value: 0.2

Items.GradScavWeaponModAbility:
  effectors:
    - $base: Perks.ApplyEffectorOnPlayer
      prereqRecord:
        $type: StatPrereq
        statType: TechnicalAbilitySkill
        valueToCheck: 55
        comparisonType: Less
      effectorToApply:
        $base: Effectors.TriggerAttackOnNearbyEnemiesEffector
        prereqRecord:
          $base: Prereqs.ProcessHitTriggered
          conditions:
            - $base: Prereqs.AttackTypeHitPrereqCondition
              attackType: Ranged
            - $base: Prereqs.WeaponTypeHitPrereqCondition
              weaponType: Ranged
            - $base: Prereqs.BodyPartHitPrereqCondition
              bodyPart: Head
            - $base: Prereqs.StatusEffectPresentHitPrereqCondition
              tagToCheck: DPAE_EMP_Active
              checkType: CheckType.Tag
              objectToCheck: Instigator
        attackRecord: Attacks.ScavChainLightning
        playVFXOnHitTargets: electric_hit
        targetHowManyEnemies: 2
        targetMaxDistance: 10.0
        targetMinDistance: 0.3
    - $base: Perks.ApplyEffectorOnPlayer
      prereqRecord:
        $type: StatPrereq
        statType: TechnicalAbilitySkill
        valueToCheck: 55
        comparisonType: GreaterOrEqual
      effectorToApply:
        $base: Effectors.TriggerAttackOnNearbyEnemiesEffector
        prereqRecord:
          $base: Prereqs.ProcessHitTriggered
          conditions:
            - $base: Prereqs.AttackTypeHitPrereqCondition
              attackType: Ranged
            - $base: Prereqs.WeaponTypeHitPrereqCondition
              weaponType: Ranged
            - $base: Prereqs.BodyPartHitPrereqCondition
              bodyPart: Head
            - $base: Prereqs.StatusEffectPresentHitPrereqCondition
              tagToCheck: DPAE_EMP_Active
              checkType: CheckType.Tag
              objectToCheck: Instigator
        attackRecord: Attacks.ScavChainLightningTech55
        playVFXOnHitTargets: electric_hit
        targetHowManyEnemies: 2
        targetMaxDistance: 10.0
        targetMinDistance: 0.3

Items.BrickSataraWeaponModAbility:
  effectors:
    - $base: Effectors.TriggerAttackOnTargetEffect
      prereqRecord:
        $base: Prereqs.ANDPrereq
        nestedPrereqs:
          - $type: StatPoolPrereq
            statPoolType: WeaponCharge
            valueToCheck:
              - $type: gamedataConstantStatModifier_Record
                statType: BaseStats.Charge
                modifierType: Additive
                value: 65.0
            comparisonType: GreaterOrEqual
            objectToCheck: Weapon
          - $base: Prereqs.ProcessHitTriggered
            conditions:
              - $base: Prereqs.StatusEffectPresentHitPrereqCondition
                statusEffect: Defeated
                checkType: CheckType.Type
                invert: true
              - $base: Prereqs.StatusEffectPresentHitPrereqCondition
                statusEffect: Unconscious
                checkType: CheckType.Type
                invert: true
              - $base: Prereqs.StatPoolHitPrereqCondition
                valueToCheck: 0.0
                objectToCheck: Target
                statPoolToCompare: Health
                comparisonType: NotEqual
              - $base: Prereqs.AttackTypeHitPrereqCondition
                attackType: Ranged
                onlyOncePerShot: true
              - $base: Prereqs.StatusEffectPresentHitPrereqCondition
                tagToCheck: DPAE_EMP_Active
                checkType: CheckType.Tag
                objectToCheck: Instigator
      attackRecord: Attacks.EMPBrick
      isRandom: true
      playerAsInstigator: true

Items.TesteraNicolasWeaponModAbility:
  effectors:
    - $base: Effectors.TriggerAttackOnTargetEffect
      prereqRecord:
        $base: Prereqs.ProcessHitTriggered
        conditions:
          - $base: Prereqs.StatusEffectPresentHitPrereqCondition
            statusEffect: Defeated
            checkType: CheckType.Type
            invert: true
          - $base: Prereqs.StatusEffectPresentHitPrereqCondition
            statusEffect: Unconscious
            checkType: CheckType.Type
            invert: true
          - $base: Prereqs.StatPoolHitPrereqCondition
            valueToCheck: 0.0
            objectToCheck: Target
            statPoolToCompare: Health
            comparisonType: NotEqual
          - $base: Prereqs.AttackTypeHitPrereqCondition
            attackType: Ranged
            onlyOncePerShot: true
          - $base: Prereqs.WeaponTypeHitPrereqCondition
            weaponType: Ranged
          - $base: Prereqs.StatusEffectPresentHitPrereqCondition
            tagToCheck: DPAE_HE_Active_Tag
            checkType: CheckType.Tag
            objectToCheck: Instigator
      attackRecord: Attacks.TesteraExplosionAttack
      isRandom: true
      applicationChance: 1.0
    - $base: Perks.ApplyStatusEffectOnPlayer
      prereqRecord:
        $base: Prereqs.ANDPrereq
        nestedPrereqs:
          - $base: Prereqs.PostProcessHitTriggered
            isSynchronous: false
            conditions:
              - Prereqs.TargetKilledHitPrereqCondition
              - $base: Prereqs.AttackTypeHitPrereqCondition
                attackType: QuickMelee
                invert: true
              - $base: Prereqs.StatusEffectPresentHitPrereqCondition
                statusEffect: Defeated
                checkType: CheckType.Type
                invert: true
          - $base: Perks.IsPlayerInLowHealth
            comparisonType: Greater
      statusEffect: BaseStatusEffect.Testera_Nicolas_SelfBurning
      instigator: Player
